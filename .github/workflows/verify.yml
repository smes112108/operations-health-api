name: Verify portfolio

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install the recorded dependency versions
        run: python -m pip install -r requirements-lock.txt
      - name: Run integration tests
        run: python -m pytest -q

  docker-smoke:
    name: Docker build and HTTP walkthrough
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'
      - name: Validate configuration
        run: docker compose config --quiet
      - name: Build and wait for readiness
        run: docker compose up --build --wait --wait-timeout 90
      - name: Exercise the container over HTTP
        run: python scripts/walkthrough.py http://127.0.0.1:8000
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the demo
        if: always()
        run: docker compose down
