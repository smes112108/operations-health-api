services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      OPERATIONS_DB_PATH: /app/data/operations.db
      STALE_AFTER_SECONDS: ${STALE_AFTER_SECONDS:-300}
    volumes:
      - operations-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  operations-data:
